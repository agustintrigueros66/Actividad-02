<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulario.css">
    <title>Document</title>
</head>

<body>
    <header>
        <nav>
            <a href="Recetas.html">HOME</a>
            <p>|</p>
            <a href="#">CONTACTO</a>
        </nav>
    </header>
    <main class="contacto">
        <div class="formulario">
            <form action="">
                <div class="campo">
                    <label for="nombre">Nombre: </label>
                    <input required name="nombre" type="text" id="nombre">
                </div>
                <div class="campo">
                    <label for="e-mail">E-mail: </label>
                    <input required name="email" type="email" id="e-mail">
                </div>
                <div class="campo">
                    <label for="tel">Tel: </label>
                    <input required name="tel" type="tel" id="tel">
                </div>
                <div class="campo">
                    <label for="msj">Mensaje: </label>
                    <textarea required name="Mensaje" id="msj"></textarea>
                </div>
                <div class="botones">
                    <button class="enviar" type="submit">Enviar</button>
                    <button class="cancelar" type="reset">Cancelar</button>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <p>Todos los derechos reservados</p>
    </footer>
</body>

</html>
